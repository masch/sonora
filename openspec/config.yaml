context: >
  Sonora is an Expo SDK 56 universal app (iOS, Android, Web) built with
  Expo Router (file-based routing), React Native 0.85, React 19, TypeScript 6.0
  (strict), and Bun as package manager. Project structure follows
  src/{app,components,constants,hooks,tw} convention with path aliases
  (@/* → src/*, @/assets/* → assets/*). Styling uses NativeWind v5
  (Tailwind CSS v4, CSS-first config) with className via CSS-wrapped
  components in src/tw/. Theme system is CSS-only via @theme and @variant dark
  in global.css; RuntimeColors in theme.ts is a minimal JS bridge for 3
  native-only consumers (SymbolView tintColor, NativeTabs props).
  use-color-scheme.web.ts provides SSR-safe color scheme detection.
  No backend or data layer yet. AGENTS.md mandates Expo v56 versioned docs.

