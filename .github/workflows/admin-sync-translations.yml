name: 3-ADMIN Sync Translations

on:
  schedule:
    # Weekly: Monday 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Run sync script
        id: sync
        continue-on-error: false
        env:
          API_URL: https://sonora-api.sonora-api.workers.dev
        run: |
          cd apps/api && bun run scripts/sync-translations.ts --api-url "$API_URL" 2>&1 | tee /tmp/sync-output.log
          exit_code="${PIPESTATUS[0]}"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

          # Extract changed keys from script output (between "key(s) differ:" and next blank or section)
          echo "diff<<EOF" >> "$GITHUB_OUTPUT"
          grep '•' /tmp/sync-output.log || echo '(none)'
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create Signed Commit and Pull Request
        id: pr
        if: steps.sync.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.PAT_PR_ONLY }}
          BRANCH: chore/sync-translations-${{ github.run_id }}
        run: |
          set -euo pipefail

          # 1. Import the dedicated CI GPG key for signing (stored as base64)
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --import --batch 2>&1
          echo "GPG key imported for Sonora Sync Bot"

          # 2. Configure git to sign with the CI GPG key
          git config user.name "Sonora Sync Bot"
          git config user.email "53308354+masch@users.noreply.github.com"
          git config user.signingkey B582DA929F4E996F
          git config commit.gpgsign true

          # 3. Stage changed files and commit (signed with GPG)
          git add -A
          git commit -S -m "chore: sync translations from admin panel"
          echo "Signed commit created: $(git rev-parse HEAD)"

          # 4. Push the branch (authenticate with PAT for push access)
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          echo "Branch pushed: $BRANCH"

          # 5. Create PR
          # Build PR body
          echo "Automated sync of DB translation overrides back into git-tracked locale files." > /tmp/pr-body.md
          echo "" >> /tmp/pr-body.md
          echo "**Changed keys:**" >> /tmp/pr-body.md
          echo '```' >> /tmp/pr-body.md
          grep '•' /tmp/sync-output.log >> /tmp/pr-body.md || true
          echo '```' >> /tmp/pr-body.md
          echo "" >> /tmp/pr-body.md
          echo "> [!IMPORTANT]" >> /tmp/pr-body.md
          echo "> Manual review required before merging. Verify each changed value matches expected copy." >> /tmp/pr-body.md

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: sync translations from admin panel — ${{ github.event.repository.updated_at }}" \
            --body-file /tmp/pr-body.md \
            --label "type:chore"
          PR_NUMBER=$(gh pr view "$BRANCH" --json number --jq '.number')
          echo "pull-request-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.sync.outputs.exit_code }}" = "0" ]; then
            echo "✅ No translation changes detected. All local files match DB."
          elif [ "${{ steps.pr.outputs.pull-request-number }}" != "" ]; then
            echo "📦 PR #${{ steps.pr.outputs.pull-request-number }} created with synced translations."
          else
            echo "⚠️ Translation changes detected but no PR was created."
          fi
