name: PR Check

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      api: ${{ steps.filter.outputs.api }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'packages/shared/**'
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
            admin:
              - 'apps/admin/**'
              - 'packages/shared/**'

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # TEMP: --minimum-release-age=0 bypasses minimumReleaseAge in bunfig.toml
      # Lockfile pinned expo 56.x packages published 2026-06-15 (< 4 days).
      # Remove when packages are > 4 days old (~Jun 19). Tracked in #127.
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - run: make format-check

  validate-mobile:
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      # TEMP: --minimum-release-age=0 bypasses minimumReleaseAge in bunfig.toml
      # Lockfile pinned expo 56.x packages published 2026-06-15 (< 4 days).
      # Remove when packages are > 4 days old (~Jun 19). Tracked in #127.
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - run: make test-front
      - run: make test-shared
      - run: bun --filter @sonora/mobile lint
      - run: bun --filter @sonora/mobile typecheck
      - name: Fetch base branch for diff scan
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.ref }}
      - name: React Doctor (diff scan — required)
        run: make doctor-diff BASE=origin/${{ github.event.pull_request.base.ref }}
      - name: React Doctor (full scan — required)
        run: make doctor

  validate-api:
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # TEMP: --minimum-release-age=0 bypasses minimumReleaseAge in bunfig.toml
      # Lockfile pinned expo 56.x packages published 2026-06-15 (< 4 days).
      # Remove when packages are > 4 days old (~Jun 19). Tracked in #127.
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - run: make api-test
      - run: make test-shared
      - run: bun --filter @sonora/api typecheck

  validate-admin:
    needs: changes
    if: ${{ needs.changes.outputs.admin == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # TEMP: --minimum-release-age=0 bypasses minimumReleaseAge in bunfig.toml
      # Lockfile pinned expo 56.x packages published 2026-06-15 (< 4 days).
      # Remove when packages are > 4 days old (~Jun 19). Tracked in #127.
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - run: make test-admin
      - run: make test-shared
      - run: bun --filter @sonora/admin lint
      - run: bun --filter @sonora/admin typecheck
