name: Expo SDK Version Sync

on:
  schedule:
    # Weekly: Monday 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: expo-sdk-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Check Expo SDK version mismatches
        id: check
        continue-on-error: true
        run: |
          set +e
          cd apps/mobile && npx expo install --check > /tmp/expo-check-mobile.log 2>&1
          exit_mobile=$?
          cd ../admin && npx expo install --check > /tmp/expo-check-admin.log 2>&1
          exit_admin=$?
          set -e

          if [ $exit_mobile -ne 0 ] || [ $exit_admin -ne 0 ]; then
            exit_code=1
          else
            exit_code=0
          fi

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          echo "### 📱 Mobile App:" >> "$GITHUB_OUTPUT"
          cat /tmp/expo-check-mobile.log >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "### 💼 Admin Portal:" >> "$GITHUB_OUTPUT"
          cat /tmp/expo-check-admin.log >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Apply Expo SDK version fixes
        if: steps.check.outputs.exit_code != '0'
        env:
          BUN_CONFIG_INSTALL_MINIMUM_RELEASE_AGE: '0'
        run: |
          fix_expo_deps() {
            local dir=$1
            echo "Applying fixes in $dir..."
            cd "$dir"
            cp ../../bunfig.toml /tmp/bunfig.toml.bak
            sed -i 's/minimumReleaseAge = 345600/minimumReleaseAge = 0/' ../../bunfig.toml
            npx expo install --fix
            mv /tmp/bunfig.toml.bak ../../bunfig.toml

            node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const tracked = Object.keys(pkg.dependencies || {}).filter(
              k => k.startsWith('expo') || k.startsWith('@expo/') || k === 'react-native-webview'
            );
            for (const k of tracked) {
              pkg.dependencies[k] = pkg.dependencies[k].replace(/^[\^~]/, '');
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            cd - > /dev/null
          }

          fix_expo_deps "apps/mobile"
          fix_expo_deps "apps/admin"

      - name: Sync bun lockfile after expo install
        if: steps.check.outputs.exit_code != '0'
        env:
          BUN_CONFIG_INSTALL_MINIMUM_RELEASE_AGE: '0'
        run: bun install

      - name: Create Pull Request
        id: pr
        if: steps.check.outputs.exit_code != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT_PR_ONLY }}
          commit-message: 'chore: sync expo sdk dependency versions'
          branch: chore/expo-sdk-version-sync
          title: 'chore: sync expo sdk dependency versions'
          body: |
            Automated sync of Expo SDK dependency versions via `expo install --fix` for Mobile and Admin Portal.

            **Mismatches detected:**
            ```
            ${{ steps.check.outputs.output }}
            ```

            > [!IMPORTANT]
            > Manual review required before merging. All PR checks must pass.
          labels: dependencies

      - name: Trigger staging deploy with updates
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-mobile-staging.yml \
            --ref chore/expo-sdk-version-sync \
            -f deploy_web=true -f deploy_android=true -f firebase_team=internal
          gh workflow run deploy-admin-staging.yml \
            --ref chore/expo-sdk-version-sync

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.check.outputs.exit_code }}" = "0" ]; then
            echo "✅ No mismatches detected. All good."
          elif [ "${{ steps.pr.outputs.pull-request-number }}" != "" ]; then
            echo "📦 PR #${{ steps.pr.outputs.pull-request-number }} created with fixes."
            echo "🚀 Staging deploy triggered from branch chore/expo-sdk-version-sync."
          else
            echo "⚠️ Mismatches detected but no changes were generated."
          fi
