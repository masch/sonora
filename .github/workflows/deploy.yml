name: Deploy App

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: cd api && bun install --frozen-lockfile
      - run: make format-check test lint typecheck
      - name: Deploy to EAS Hosting
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: make eas-build-web
      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Android Preview APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_INTERACTIVE: '1'
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: make eas-build-android-preview-local
      - name: Distribute Android APK to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          FIREBASE_RELEASE_NOTES: Build ${{ github.run_number }} - ${{ github.event.head_commit.message }}
        run: make firebase-distribute-all
      - name: Commit and Push Version Bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.config.ts
          git commit -m "chore: bump android versionCode [skip ci]" || echo "No changes to commit"
          git push
