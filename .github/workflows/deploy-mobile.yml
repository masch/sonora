name: Deploy Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'Makefile'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPO_PUBLIC_API_URL: https://sonora-api.sonora-api.workers.dev

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # TEMP: --minimum-release-age=0 bypasses minimumReleaseAge in bunfig.toml
      # Lockfile pinned expo 56.x packages published 2026-06-15 (< 4 days).
      # Remove when packages are > 4 days old (~Jun 19). Tracked in #127.
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - run: make check
      - name: Deploy to EAS Hosting
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: make eas-build-web
      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Android Preview APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_INTERACTIVE: '1'
          APP_VERSION_CODE: ${{ github.run_number }}
          EXPO_NO_DOCTOR: '1'
        run: make eas-build-android-preview-ci
      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/build-*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Authenticate to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/gcp-key.json
      - name: Distribute Android APK to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
          APP_VERSION_CODE: ${{ github.run_number }}
          RAW_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          CLEAN_MSG=$(echo "$RAW_COMMIT_MESSAGE" | head -n 1 | sed 's/"/\\"/g')
          export FIREBASE_RELEASE_NOTES="Build ${{ github.run_number }} - $CLEAN_MSG"
          make firebase-distribute-all
