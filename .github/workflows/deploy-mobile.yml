name: Deploy Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'Makefile'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPO_PUBLIC_API_URL: https://sonora-api.sonora-api.workers.dev

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk_path: ${{ steps.build-apk.outputs.apk_path }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # TEMP: --minimum-release-age=0 bypasses minimumReleaseAge in bunfig.toml
      # Lockfile pinned expo 56.x packages published 2026-06-15 (< 4 days).
      # Remove when packages are > 4 days old (~Jun 19). Tracked in #127.
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - run: make check
      - name: Deploy to EAS Hosting
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: make eas-build-web
      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Android Preview APK
        id: build-apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_INTERACTIVE: '1'
          APP_VERSION_CODE: ${{ github.run_number }}
          EXPO_NO_DOCTOR: '1'
        run: |
          make eas-build-android-preview-ci
          # Export the exact APK path that was generated
          APK_PATH=$(ls -t apps/mobile/build-*.apk 2>/dev/null | head -1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/build-*.apk
          if-no-files-found: error
          retention-days: 7

  deploy-firebase:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - uses: oven-sh/setup-bun@v2
      # TEMP: --minimum-release-age=0 bypasses minimumReleaseAge in bunfig.toml
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apps/mobile
      # Write service account key and distribute via Node.js.
      # Using node directly instead of bun because firebase-tools' internal
      # google-auth-library doesn't reliably read GOOGLE_APPLICATION_CREDENTIALS
      # under bun's runtime in CI (confirmed across multiple attempts).
      - name: Distribute Android APK to Firebase
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/apps/mobile/firebase-sa-key.json
          RAW_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          APK_PATH: ${{ needs.build.outputs.apk_path }}
        run: |
          # Write service account key
          mkdir -p apps/mobile
          echo "$FIREBASE_SA_KEY" > apps/mobile/firebase-sa-key.json

          CLEAN_MSG=$(echo "$RAW_COMMIT_MESSAGE" | head -n 1 | sed 's/"/\\"/g')
          export FIREBASE_RELEASE_NOTES="Build ${{ github.run_number }} - $CLEAN_MSG"
          node apps/mobile/node_modules/firebase-tools/lib/bin/firebase.js \
            appdistribution:distribute "$APK_PATH" \
            --app "1:967054219260:android:aad883fdf7059bec060479" \
            --groups "dev-team,sonora-team" \
            --release-notes "$FIREBASE_RELEASE_NOTES" \
            --non-interactive
