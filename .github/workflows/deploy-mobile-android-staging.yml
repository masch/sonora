name: 2-STG Mobile Android

on:
  workflow_dispatch:
    inputs:
      firebase_groups:
        description: 'Firebase App Distribution Groups (comma-separated)'
        required: true
        type: string
        default: 'dev-team'
  workflow_call:
    inputs:
      firebase_groups:
        description: 'Firebase App Distribution Groups (comma-separated)'
        required: false
        type: string
        default: 'dev-team'
      skip_tagging:
        description: 'Skip tagging'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPO_PUBLIC_API_URL: https://sonora-api-staging.sonora-api.workers.dev

concurrency:
  group: deploy-android-staging
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      apk_path: ${{ steps.build-apk.outputs.apk_path }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: make check
      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Write google-services.json
        env:
          ANDROID_GOOGLE_SERVICES_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_BASE64 }}
        run: |
          echo "$ANDROID_GOOGLE_SERVICES_BASE64" | base64 -d > apps/mobile/google-services.json
          git add -f apps/mobile/google-services.json

      - name: Calculate Version Code
        id: version-code
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "val=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
      - name: Build Android Preview APK
        id: build-apk
        env:
          APP_ENV: staging
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_INTERACTIVE: '1'
          APP_VERSION_CODE: ${{ steps.version-code.outputs.val }}
          EXPO_NO_DOCTOR: '1'
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
        run: |
          make eas-build-android-preview-ci
          # Export the exact APK path that was generated
          APK_PATH=$(ls -t apps/mobile/build-*.apk 2>/dev/null | head -1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/build-*.apk
          if-no-files-found: error
          retention-days: 7

  distribute-firebase:
    runs-on: ubuntu-latest
    needs: build-android
    environment: staging
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apps/mobile
      - name: Generate Tag-Based Release Notes
        id: release-notes
        run: |
          git fetch --tags --force
          LAST_TAG=$(git describe --tags --abbrev=0 --match "stg-v*" 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag found. Using fallback of last 5 commits."
            NOTES=$(git log -5 --pretty=format:'- %s' 2>/dev/null | tr -d '\"'\''')
          else
            echo "Generating release notes from $LAST_TAG to HEAD"
            NOTES=$(git log $LAST_TAG..HEAD --pretty=format:'- %s' 2>/dev/null | tr -d '\"'\''')
          fi

          # Clean release notes and format to avoid quotes issues
          # Use GITHUB_OUTPUT to pass the multi-line string safely
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "Staging Build ${{ github.run_number }}" >> $GITHUB_OUTPUT
          if [ -n "$NOTES" ]; then
            echo "$NOTES" >> $GITHUB_OUTPUT
          else
            echo "- No new commits" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Distribute Android APK to Firebase
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APK_PATH: ${{ needs.build-android.outputs.apk_path }}
          FIREBASE_RELEASE_NOTES: ${{ steps.release-notes.outputs.notes }}
        run: |
          # Write service account key
          mkdir -p apps/mobile
          echo "$FIREBASE_SA_KEY" > apps/mobile/firebase-sa-key.json

          make firebase-distribute \
            APP_ENV=staging \
            FIREBASE_APK_PATH="$APK_PATH" \
            GROUPS="${{ inputs.firebase_groups || github.event.inputs.firebase_groups || 'dev-team' }}" \
            FIREBASE_RELEASE_NOTES="$FIREBASE_RELEASE_NOTES"
      - name: Tag deployment
        if: ${{ inputs.skip_tagging != true }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BASE_TAG="stg-v$VERSION"
          git fetch --tags --force
          if ! git rev-parse "$BASE_TAG" >/dev/null 2>&1; then
            TAG_NAME="$BASE_TAG"
          else
            LAST_REV=$(git tag -l "$BASE_TAG-*" | sed "s/$BASE_TAG-//" | grep -E '^[0-9]+$' | sort -n | tail -n 1)
            if [ -z "$LAST_REV" ]; then
              NEW_REV=1
            else
              NEW_REV=$((LAST_REV + 1))
            fi
            TAG_NAME="$BASE_TAG-$NEW_REV"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
