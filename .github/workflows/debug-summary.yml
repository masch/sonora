name: Debug Summary
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Write a summary
        run: |
          echo "## Works?" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This should appear as markdown." >> "$GITHUB_STEP_SUMMARY"

      - name: Debug env
        run: |
          echo "GITHUB_STEP_SUMMARY=$GITHUB_STEP_SUMMARY"
          ls -la "$GITHUB_STEP_SUMMARY" 2>/dev/null && echo "file ok"
          head -5 "$GITHUB_STEP_SUMMARY" 2>/dev/null
