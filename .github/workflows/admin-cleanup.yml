name: Admin Cleanup (Monthly)

on:
  schedule:
    - cron: '0 6 1 * *' # 1st of each month at 06:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Close stale issues and PRs
        uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been inactive for 30 days and is older than 90 days.
            It will be closed automatically. If this is still relevant, please
            comment to keep it open.
          stale-pr-message: >
            This PR has been inactive for 30 days and is older than 90 days.
            It will be closed automatically. If this is still relevant, please
            update it to keep it open.
          days-before-issue-stale: 60
          days-before-issue-close: 30
          days-before-pr-stale: 60
          days-before-pr-close: 30
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete stale branches
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete branches without commits in 60 days, excluding protected branches
          thirty_days_ago=$(date -d "60 days ago" +%Y-%m-%dT%H:%M:%SZ)
          gh api "repos/${{ github.repository }}/branches" --paginate \
            --jq '.[].name' \
            | while read -r branch; do
                case "$branch" in
                  main|develop|feat/*|fix/*)
                    echo "Skipping protected branch: $branch"
                    continue
                    ;;
                esac
                last_commit_date=$(gh api "repos/${{ github.repository }}/commits?sha=$branch&per_page=1" \
                  --jq '.[0].commit.committer.date' 2>/dev/null || echo "")
                if [ -z "$last_commit_date" ]; then
                  echo "Skipping $branch (no commits found)"
                  continue
                fi
                if [[ "$last_commit_date" < "$thirty_days_ago" ]]; then
                  echo "Deleting stale branch: $branch (last commit: $last_commit_date)"
                  gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$branch" || \
                    echo "Failed to delete $branch"
                fi
              done

      - name: Clean up old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 60
          keep_minimum_runs: 6
