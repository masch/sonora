name: 1-PROD Deploy All

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Manual: Compile and deploy Android App (Firebase App Distribution)'
        required: true
        type: boolean
        default: true
      firebase_groups:
        description: 'Firebase App Distribution Groups (comma-separated)'
        required: true
        type: string
        default: 'sonora-team'
  schedule:
    - cron: '0 0 */3 * *'

permissions:
  contents: write

jobs:
  check-changes:
    name: Check for recent commits
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger: bypassing change detection."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            # Check for commits in the last 3 days
            COMMITS=$(git log --since="3 days ago" --oneline)
            if [ -z "$COMMITS" ]; then
              echo "No commits found in the last 3 days."
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            else
              echo "Commits found:"
              echo "$COMMITS"
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  deploy-web:
    name: Deploy Web
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    uses: ./.github/workflows/deploy-mobile-web-production.yml
    with:
      skip_tagging: true
    secrets: inherit

  deploy-api:
    name: Deploy API
    needs: [check-changes, deploy-web]
    if: needs.check-changes.outputs.has_changes == 'true'
    uses: ./.github/workflows/deploy-api-production.yml
    with:
      skip_tagging: true
    secrets: inherit

  deploy-android:
    name: Deploy Android
    needs: [check-changes, deploy-api]
    if: |
      needs.check-changes.outputs.has_changes == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.build_android == 'true')
    uses: ./.github/workflows/deploy-mobile-android-production.yml
    with:
      firebase_groups: ${{ github.event.inputs.firebase_groups || 'sonora-team' }}
      skip_tagging: true
    secrets: inherit

  tag-release:
    name: Tag Release
    needs: [deploy-web, deploy-api, deploy-android]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create and Push Unified Tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BASE_TAG="prod-v$VERSION"
          git fetch --tags --force
          if ! git rev-parse "$BASE_TAG" >/dev/null 2>&1; then
            TAG_NAME="$BASE_TAG"
          else
            LAST_REV=$(git tag -l "$BASE_TAG-*" | sed "s/$BASE_TAG-//" | grep -E '^[0-9]+$' | sort -n | tail -n 1)
            if [ -z "$LAST_REV" ]; then
              NEW_REV=1
            else
              NEW_REV=$((LAST_REV + 1))
            fi
            TAG_NAME="$BASE_TAG-$NEW_REV"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
