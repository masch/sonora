name: Deploy Production (API & Mobile)

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Manual: Compile and deploy Android App (Firebase App Distribution)'
        required: true
        type: boolean
        default: true
      firebase_groups:
        description: 'Firebase App Distribution Groups (comma-separated)'
        required: true
        type: string
        default: 'dev-team'
  schedule:
    - cron: '0 0 */3 * *'

jobs:
  check-changes:
    name: Check for recent commits
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger: bypassing change detection."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            # Check for commits in the last 3 days
            COMMITS=$(git log --since="3 days ago" --oneline)
            if [ -z "$COMMITS" ]; then
              echo "No commits found in the last 3 days."
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            else
              echo "Commits found:"
              echo "$COMMITS"
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  deploy-web:
    name: Deploy Web
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    uses: ./.github/workflows/deploy-mobile-web-production.yml
    secrets: inherit

  deploy-api:
    name: Deploy API
    needs: [check-changes, deploy-web]
    if: needs.check-changes.outputs.has_changes == 'true'
    uses: ./.github/workflows/deploy-api-production.yml
    secrets: inherit

  deploy-android:
    name: Deploy Android
    needs: [check-changes, deploy-api]
    if: |
      needs.check-changes.outputs.has_changes == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.build_android == 'true')
    uses: ./.github/workflows/deploy-mobile-android-production.yml
    with:
      firebase_groups: ${{ github.event.inputs.firebase_groups || 'dev-team' }}
    secrets: inherit
