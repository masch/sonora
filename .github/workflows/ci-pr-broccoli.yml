name: Check PR broccoli comment

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write
  checks: write

concurrency:
  group: broccoli-pr-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-broccoli:
    name: Check PR broccoli comment
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request) || github.event_name == 'pull_request_review' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify latest PR comment is 🥦
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "Not a PR event. Skipping."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          fi

          COMMIT_DATE=""
          if [ -n "$HEAD_SHA" ]; then
            COMMIT_DATE=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.commit.committer.date // .commit.author.date' 2>/dev/null || true)
          fi

          echo "Fetching comments and reviews for PR #$PR_NUMBER (head: ${HEAD_SHA:-unknown}, date: ${COMMIT_DATE:-unknown})..."

          if [ -n "$COMMIT_DATE" ]; then
            ISSUE_COMMENTS=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --jq ".[] | select(.created_at >= \"$COMMIT_DATE\") | .body // empty")
            REVIEWS=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --jq ".[] | select(.submitted_at >= \"$COMMIT_DATE\") | .body // empty")
          else
            ISSUE_COMMENTS=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --jq '.[].body // empty')
            REVIEWS=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --jq '.[].body // empty')
          fi

          LAST_COMMENT=$(printf "%s\n%s" "$ISSUE_COMMENTS" "$REVIEWS" | grep -v "^$" | tail -n 1 | tr -d '\r' | xargs)

          echo "Latest comment/review on PR #$PR_NUMBER since commit date: '${LAST_COMMENT:-<none>}'"

          if [ "$LAST_COMMENT" != "🥦" ]; then
            echo "::error::The latest comment on PR #$PR_NUMBER since commit $HEAD_SHA must be 🥦 but was '${LAST_COMMENT:-<none>}'."
            if [ -n "$HEAD_SHA" ]; then
              gh api "repos/$REPO/statuses/$HEAD_SHA" \
                -f state="failure" \
                -f context="Check PR broccoli comment" \
                -f description="New commit requires a new 🥦 comment" > /dev/null 2>&1 || true
              gh api "repos/$REPO/check-runs" \
                -f name="Check PR broccoli comment" \
                -f head_sha="$HEAD_SHA" \
                -f status="completed" \
                -f conclusion="failure" \
                -f output='{"title":"Broccoli Approval Required","summary":"New commit requires a new 🥦 comment"}' > /dev/null 2>&1 || true
            fi
            exit 1
          fi

          echo "✅ Latest comment since commit $HEAD_SHA is 🥦 — check passed!"
          if [ -n "$HEAD_SHA" ]; then
            gh api "repos/$REPO/statuses/$HEAD_SHA" \
              -f state="success" \
              -f context="Check PR broccoli comment" \
              -f description="Latest comment is 🥦" > /dev/null 2>&1 || true
            gh api "repos/$REPO/check-runs" \
              -f name="Check PR broccoli comment" \
              -f head_sha="$HEAD_SHA" \
              -f status="completed" \
              -f conclusion="success" \
              -f output='{"title":"Broccoli Approval Passed","summary":"Latest comment since commit is 🥦"}' > /dev/null 2>&1 || true
          fi
