name: 4-CI PR Check

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-broccoli:
    name: Check PR broccoli emoji approval (🥦)
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request) }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify latest PR comment is 🥦
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "Not a PR event. Skipping."
            exit 0
          fi

          echo "Fetching comments for PR #$PR_NUMBER..."
          LAST_COMMENT=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --jq '.[-1].body // empty' | tr -d '\r' | xargs)

          echo "Latest comment on PR #$PR_NUMBER: '$LAST_COMMENT'"

          if [ "$LAST_COMMENT" != "🥦" ]; then
            echo "::error::The latest comment on PR #$PR_NUMBER must be 🥦 but was '${LAST_COMMENT:-<none>}'."
            exit 1
          fi

          echo "✅ Latest comment is 🥦 — check passed!"

  changes:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      api: ${{ steps.filter.outputs.api }}
      admin: ${{ steps.filter.outputs.admin }}
      config: ${{ steps.filter.outputs.config }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'packages/shared/**'
              - 'bun.lock'
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'bun.lock'
            admin:
              - 'apps/admin/**'
              - 'packages/shared/**'
              - 'bun.lock'
            config:
              - 'bun.lock'
              - 'apps/mobile/package.json'
              - 'apps/mobile/metro.config.js'
              - 'apps/mobile/babel.config.js'

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: make format-check

  openspec-archived:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: make verify-openspec-archived

  validate-mobile:
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: make test-front
      - run: make test-shared
      - run: bun --filter @sonora/mobile lint
      - run: bun --filter @sonora/mobile typecheck
      - name: Fetch base branch for diff scan
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.ref }}
      - name: React Doctor (diff scan — required)
        run: make doctor-diff BASE=origin/${{ github.event.pull_request.base.ref }}
      - name: React Doctor (full scan — required)
        run: make doctor
      - name: Verify Web Bundle (catch CJS interop bugs)
        if: ${{ needs.changes.outputs.config == 'true' }}
        run: make verify-web

  validate-api:
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: make api-test
      - run: make test-shared
      - run: bun --filter @sonora/api typecheck

  validate-admin:
    needs: changes
    if: ${{ needs.changes.outputs.admin == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: make test-admin
      - run: make test-shared
      - run: bun --filter @sonora/admin lint
      - run: bun --filter @sonora/admin typecheck
