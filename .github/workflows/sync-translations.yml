name: Sync Translations from Admin Panel

on:
  schedule:
    # Weekly: Monday 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --minimum-release-age=0

      - name: Run sync script
        id: sync
        continue-on-error: false
        env:
          API_URL: https://sonora-api.sonora-api.workers.dev
        run: |
          cd apps/api && bun run scripts/sync-translations.ts --api-url "$API_URL" 2>&1 | tee /tmp/sync-output.log
          exit_code="${PIPESTATUS[0]}"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

          # Extract changed keys from script output (between "key(s) differ:" and next blank or section)
          echo "diff<<EOF" >> "$GITHUB_OUTPUT"
          grep '•' /tmp/sync-output.log || echo '(none)'
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create Verified Commit and Pull Request via API
        id: pr
        if: steps.sync.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.PAT_PR_ONLY }}
          BRANCH: chore/sync-translations-${{ github.run_id }}
          OWNER_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 1. Get base commit and tree from main
          BASE_SHA=$(gh api repos/$OWNER_REPO/git/refs/heads/main --jq '.object.sha')
          BASE_TREE=$(gh api repos/$OWNER_REPO/git/commits/$BASE_SHA --jq '.tree.sha')
          echo "Base commit: $BASE_SHA"

          # 2. Create blobs for changed locale files and build tree entries
          TREE_ENTRIES="[]"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            CONTENT=$(base64 -w0 "$file")
            BLOB_SHA=$(gh api repos/$OWNER_REPO/git/blobs \
              -f content="$CONTENT" \
              -f encoding="base64" \
              --jq '.sha')
            TREE_ENTRIES=$(echo "$TREE_ENTRIES" | jq \
              --arg path "$file" \
              --arg sha "$BLOB_SHA" \
              '. + [{"path": $path, "mode": "100644", "type": "blob", "sha": $sha}]')
            echo "  + blob $BLOB_SHA → $file"
          done < <(git diff --name-only)

          # 3. Create a tree with the new blobs
          TREE_SHA=$(gh api repos/$OWNER_REPO/git/trees \
            --field base_tree="$BASE_TREE" \
            --field tree="$TREE_ENTRIES" \
            --jq '.sha')
          echo "Tree: $TREE_SHA"

          # 4. Create a commit via API (GitHub marks it "Verified")
          COMMIT_SHA=$(gh api repos/$OWNER_REPO/git/commits \
            -f message="chore: sync translations from admin panel" \
            -f tree="$TREE_SHA" \
            -f parents[0]="$BASE_SHA" \
            --jq '.sha')
          echo "Commit: $COMMIT_SHA"

          # 5. Create or update the branch
          if gh api repos/$OWNER_REPO/git/refs/heads/"$BRANCH" &>/dev/null; then
            gh api repos/$OWNER_REPO/git/refs/heads/"$BRANCH" \
              -X PATCH -f sha="$COMMIT_SHA" -f force=true
            echo "Branch updated: $BRANCH"
          else
            gh api repos/$OWNER_REPO/git/refs \
              -f ref="refs/heads/$BRANCH" \
              -f sha="$COMMIT_SHA"
            echo "Branch created: $BRANCH"
          fi

          # 6. Create PR if not exists
          PR_NUMBER=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$PR_NUMBER" ]; then
            # Build PR body
            echo "Automated sync of DB translation overrides back into git-tracked locale files." > /tmp/pr-body.md
            echo "" >> /tmp/pr-body.md
            echo "**Changed keys:**" >> /tmp/pr-body.md
            echo '```' >> /tmp/pr-body.md
            grep '•' /tmp/sync-output.log >> /tmp/pr-body.md || true
            echo '```' >> /tmp/pr-body.md
            echo "" >> /tmp/pr-body.md
            echo "> [!IMPORTANT]" >> /tmp/pr-body.md
            echo "> Manual review required before merging. Verify each changed value matches expected copy." >> /tmp/pr-body.md

            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: sync translations from admin panel — ${{ github.event.repository.updated_at }}" \
              --body-file /tmp/pr-body.md \
              --label "type:chore"
            PR_NUMBER=$(gh pr view --json number --jq '.number')
          fi
          echo "pull-request-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.sync.outputs.exit_code }}" = "0" ]; then
            echo "✅ No translation changes detected. All local files match DB."
          elif [ "${{ steps.pr.outputs.pull-request-number }}" != "" ]; then
            echo "📦 PR #${{ steps.pr.outputs.pull-request-number }} created with synced translations."
          else
            echo "⚠️ Translation changes detected but no PR was created."
          fi
