name: 1-PROD API

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_tagging:
        description: 'Skip tagging'
        required: false
        type: boolean
        default: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Clean root tsconfig (prevents Wrangler warnings about missing expo/tsconfig.base)
        run: rm -f tsconfig.json
      - run: make api-validate
      - name: Apply pending DB migrations (idempotent)
        run: make api-db-migrate-ci
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Seed default data (idempotent — upserts only)
        run: make api-db-seed-ci
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEED_ENV: production
      - name: Deploy to production Worker
        run: make api-deploy-production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Tag deployment
        uses: ./.github/actions/tag-release
        with:
          environment: production
          skip_tagging: ${{ inputs.skip_tagging || 'false' }}
