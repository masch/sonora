name: 1-PROD API

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_tagging:
        description: 'Skip tagging'
        required: false
        type: boolean
        default: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Clean root tsconfig (prevents Wrangler warnings about missing expo/tsconfig.base)
        run: rm -f tsconfig.json
      - run: make api-validate
      - name: Apply pending DB migrations (idempotent)
        run: make api-db-migrate-ci
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Seed default data (idempotent — upserts only)
        run: make api-db-seed-ci
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Deploy to production Worker
        run: make api-deploy-production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Tag deployment
        if: ${{ inputs.skip_tagging != true }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BASE_TAG="prod-v$VERSION"
          git fetch --tags --force
          if ! git rev-parse "$BASE_TAG" >/dev/null 2>&1; then
            TAG_NAME="$BASE_TAG"
          else
            LAST_REV=$(git tag -l "$BASE_TAG-*" | sed "s/$BASE_TAG-//" | grep -E '^[0-9]+$' | sort -n | tail -n 1)
            if [ -z "$LAST_REV" ]; then
              NEW_REV=1
            else
              NEW_REV=$((LAST_REV + 1))
            fi
            TAG_NAME="$BASE_TAG-$NEW_REV"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
