name: 1-PROD Mobile Android

on:
  workflow_dispatch:
    inputs:
      play_track:
        description: 'Google Play Track (internal, alpha, beta, production)'
        required: true
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: 'internal'
      enable_firebase:
        description: 'Enable distribution to Firebase App Distribution'
        required: false
        type: boolean
        default: false
      firebase_groups:
        description: 'Firebase App Distribution Groups (comma-separated)'
        required: false
        type: string
        default: 'sonora-team'
  workflow_call:
    inputs:
      play_track:
        description: 'Google Play Track (internal, alpha, beta, production)'
        required: false
        type: string
        default: 'internal'
      enable_firebase:
        description: 'Enable distribution to Firebase App Distribution'
        required: false
        type: boolean
        default: false
      firebase_groups:
        description: 'Firebase App Distribution Groups (comma-separated)'
        required: false
        type: string
        default: 'sonora-team'
      skip_tagging:
        description: 'Skip tagging'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPO_PUBLIC_API_URL: https://sonora-api.sonora-api.workers.dev

jobs:
  build-android:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      tag_name: ${{ steps.tag-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: make check
      - name: Tag deployment
        id: tag-release
        uses: ./.github/actions/tag-release
        with:
          environment: production
          skip_tagging: ${{ inputs.skip_tagging || 'false' }}
      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Write google-services.json
        env:
          ANDROID_GOOGLE_SERVICES_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_BASE64 }}
        run: |
          echo "$ANDROID_GOOGLE_SERVICES_BASE64" | base64 -d > apps/mobile/google-services.json
          git add -f apps/mobile/google-services.json

      - name: Build Android APK + AAB (Unsigned)
        id: build-release
        env:
          APP_ENV: production
          APP_VERSION_CODE: ${{ steps.tag-release.outputs.version-code }}
          APP_VERSION_NAME: ${{ steps.tag-release.outputs.version-name }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
        run: |
          make eas-build-android-release-ci-unsigned \
            OUTPUT_APK="sonora-${{ steps.tag-release.outputs.tag }}-unsigned.apk" \
            OUTPUT_AAB="sonora-${{ steps.tag-release.outputs.tag }}-unsigned.aab"

      - name: Upload Unsigned APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-apk
          path: apps/mobile/sonora-*-unsigned.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload Unsigned AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-aab
          path: apps/mobile/sonora-*-unsigned.aab
          if-no-files-found: error
          retention-days: 1

  sign-android:
    runs-on: ubuntu-latest
    needs: build-android
    environment: production
    outputs:
      apk_path: ${{ steps.sign-release.outputs.apk_path }}
      aab_path: ${{ steps.sign-release.outputs.aab_path }}
      tag_name: ${{ needs.build-android.outputs.tag_name }}
    steps:
      - name: Download Unsigned APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-unsigned-apk
          path: apps/mobile
      - name: Download Unsigned AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-unsigned-aab
          path: apps/mobile
      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Write production keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > apps/mobile/sonora-production-keystore.jks

      - name: Sign Android Artifacts
        id: sign-release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Find apksigner in Android SDK build-tools
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)

          # Sign APK
          $APKSIGNER sign --ks apps/mobile/sonora-production-keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out apps/mobile/sonora-${{ needs.build-android.outputs.tag_name }}.apk \
            apps/mobile/sonora-${{ needs.build-android.outputs.tag_name }}-unsigned.apk

          # Sign AAB
          jarsigner -keystore apps/mobile/sonora-production-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -signedjar apps/mobile/sonora-${{ needs.build-android.outputs.tag_name }}.aab \
            apps/mobile/sonora-${{ needs.build-android.outputs.tag_name }}-unsigned.aab \
            "$KEY_ALIAS"

          echo "apk_path=apps/mobile/sonora-${{ needs.build-android.outputs.tag_name }}.apk" >> "$GITHUB_OUTPUT"
          echo "aab_path=apps/mobile/sonora-${{ needs.build-android.outputs.tag_name }}.aab" >> "$GITHUB_OUTPUT"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/sonora-*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: apps/mobile/sonora-*.aab
          if-no-files-found: error
          retention-days: 7

  deploy-firebase:
    if: ${{ inputs.enable_firebase == true }}
    runs-on: ubuntu-latest
    needs: sign-android
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apps/mobile
      - name: Generate Tag-Based Release Notes
        id: release-notes
        uses: ./.github/actions/generate-release-notes
        with:
          tag_pattern: 'prod-v*'
          title_prefix: 'Build'
      - name: Distribute Android APK to Firebase
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APK_PATH: apps/mobile/sonora-${{ needs.sign-android.outputs.tag_name }}.apk
          FIREBASE_RELEASE_NOTES: ${{ steps.release-notes.outputs.commits }}
        run: |
          # Write service account key
          mkdir -p apps/mobile
          echo "$FIREBASE_SA_KEY" > apps/mobile/firebase-sa-key.json

          make firebase-distribute \
            APP_ENV=production \
            FIREBASE_APK_PATH="$APK_PATH" \
            GROUPS="${{ inputs.firebase_groups || github.event.inputs.firebase_groups || 'dev-team' }}"
      - name: Upload APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.sign-android.outputs.tag_name }}
          APK_PATH: apps/mobile/sonora-${{ needs.sign-android.outputs.tag_name }}.apk
        run: |
          gh release upload "$TAG_NAME" "$APK_PATH" --clobber

  deploy-play-store:
    runs-on: ubuntu-latest
    needs: sign-android
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Download Android AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: apps/mobile
      - name: Generate Tag-Based Release Notes
        id: release-notes
        uses: ./.github/actions/generate-release-notes
        with:
          tag_pattern: 'prod-v*'
          title_prefix: 'Build'
      - name: Deploy AAB to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.masch.sonora.app
          releaseFiles: apps/mobile/sonora-${{ needs.sign-android.outputs.tag_name }}.aab
          track: ${{ inputs.play_track || 'internal' }}
