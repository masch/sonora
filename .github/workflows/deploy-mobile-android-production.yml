name: 1-PROD Mobile Android

on:
  workflow_dispatch:
    inputs:
      firebase_groups:
        description: 'Firebase App Distribution Groups (comma-separated)'
        required: true
        type: string
        default: 'sonora-team'
  workflow_call:
    inputs:
      firebase_groups:
        description: 'Firebase App Distribution Groups (comma-separated)'
        required: false
        type: string
        default: 'sonora-team'
      skip_tagging:
        description: 'Skip tagging'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPO_PUBLIC_API_URL: https://sonora-api.sonora-api.workers.dev

jobs:
  build-android:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      apk_path: ${{ steps.build-apk.outputs.apk_path }}
      tag_name: ${{ steps.get-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: make check
      - name: Tag deployment
        if: ${{ (inputs.skip_tagging || 'false') != 'true' }}
        uses: ./.github/actions/tag-release
        with:
          environment: production
      - name: Determine Tag Name
        id: get-tag
        run: |
          git fetch --tags --force
          TAG_NAME=$(git describe --tags --exact-match 2>/dev/null || git describe --tags --abbrev=0 || echo "prod-v1.0.0-temp")
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Write google-services.json
        env:
          ANDROID_GOOGLE_SERVICES_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_BASE64 }}
        run: |
          echo "$ANDROID_GOOGLE_SERVICES_BASE64" | base64 -d > apps/mobile/google-services.json
          git add -f apps/mobile/google-services.json

      - name: Calculate Version Code
        id: version-code
        run: |
          git fetch --tags --force
          VERSION_CODE=$(git tag -l "prod-v*" | wc -l)
          echo "val=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Build Android Preview APK
        id: build-apk
        env:
          APP_ENV: production
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_INTERACTIVE: '1'
          APP_VERSION_CODE: ${{ steps.version-code.outputs.val }}
          EXPO_NO_DOCTOR: '1'
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
        run: |
          make eas-build-android-preview-ci OUTPUT_APK="sonora-${{ steps.get-tag.outputs.tag }}.apk"
          echo "apk_path=apps/mobile/sonora-${{ steps.get-tag.outputs.tag }}.apk" >> "$GITHUB_OUTPUT"
      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/sonora-*.apk
          if-no-files-found: error
          retention-days: 7

  deploy-firebase:
    runs-on: ubuntu-latest
    needs: build-android
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apps/mobile
      - name: Get Release Notes from Tag
        id: release-notes
        run: |
          git fetch --tags --force
          NOTES=$(git tag -l --format='%(contents)' "${{ needs.build-android.outputs.tag_name }}")
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Distribute Android APK to Firebase
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APK_PATH: apps/mobile/sonora-${{ needs.build-android.outputs.tag_name }}.apk
          FIREBASE_RELEASE_NOTES: ${{ steps.release-notes.outputs.notes }}
        run: |
          # Write service account key
          mkdir -p apps/mobile
          echo "$FIREBASE_SA_KEY" > apps/mobile/firebase-sa-key.json

          make firebase-distribute \
            APP_ENV=production \
            FIREBASE_APK_PATH="$APK_PATH" \
            GROUPS="${{ inputs.firebase_groups || github.event.inputs.firebase_groups || 'dev-team' }}"
