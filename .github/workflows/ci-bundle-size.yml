name: Bundle Size Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # TODO: The project does not yet have a size-limit configuration.
      # Create a .size-limit.json at the project root or add a "size-limit"
      # section to package.json before this workflow will work.
      # Example config for @sonora/mobile:
      #   "size-limit": [
      #     {
      #       "path": "apps/mobile/dist/**/*.js",
      #       "limit": "300 KB"
      #     }
      #   ]
      - name: Check bundle size
        uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_script: npx expo export --platform web
