name: 4-CI Bundle Size

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # TODO: Bundle size diff requires size-limit config.
      # Create a .size-limit.json at the project root or add a "size-limit"
      # section to package.json and switch to `bunx size-limit` (not the
      # upstream action — it uses npm which doesn't support workspace:*).
      # Example:
      #   "size-limit": [
      #     { "path": "apps/mobile/dist/**/*.js", "limit": "300 KB" }
      #   ]
      - name: Build web export
        run: |
          cd apps/mobile
          npx expo export --platform web --output-dir /tmp/expo-web-build
      - name: Report bundle size
        run: |
          echo "### 📦 Bundle Size" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          du -sh /tmp/expo-web-build 2>/dev/null | \
            awk '{print "| Mobile Web export | " $1 " |"}' >> $GITHUB_STEP_SUMMARY
