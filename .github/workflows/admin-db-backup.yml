name: 3-ADMIN DB Backup

on:
  schedule:
    - cron: '0 5 * * 0' # Sunday 02:00 ART (05:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      # TODO: Create missing secrets before this workflow can run:
      #   BACKUP_ENCRYPTION_KEY  — passphrase for GPG AES256 encryption
      #   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account ID (for R2 wrangler ops)
      # DATABASE_URL is already set in the production environment.

      - name: Install PostgreSQL 18 client (pg_dump compatible with server 18.x)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18 2>/dev/null || {
            # Fallback: add official PostgreSQL apt repo
            sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client-18
          }

      - name: Database backup — pg_dump → gzip → GPG → R2
        run: make api-db-backup

      - name: Audio backup — AWS S3 sync to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "Error: R2_ACCESS_KEY_ID or R2_SECRET_ACCESS_KEY secret is missing or empty in environment 'production'."
            exit 1
          fi

          DATE_TAG=$(date +%Y-%m-%d)
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          echo "Syncing sonora-production-public-audio..."
          aws s3 sync s3://sonora-production-public-audio s3://sonora-db-backups/audio/public/latest --endpoint-url "$ENDPOINT"
          aws s3 sync s3://sonora-production-public-audio "s3://sonora-db-backups/audio/public/archive/$DATE_TAG" --endpoint-url "$ENDPOINT"

          echo "Syncing sonora-production-private-audio..."
          aws s3 sync s3://sonora-production-private-audio s3://sonora-db-backups/audio/private/latest --endpoint-url "$ENDPOINT"
          aws s3 sync s3://sonora-production-private-audio "s3://sonora-db-backups/audio/private/archive/$DATE_TAG" --endpoint-url "$ENDPOINT"

          # Post-check: Verify objects exist in latest backup bucket
          PUBLIC_COUNT=$(aws s3 ls s3://sonora-db-backups/audio/public/latest/ --endpoint-url "$ENDPOINT" | wc -l)
          PRIVATE_COUNT=$(aws s3 ls s3://sonora-db-backups/audio/private/latest/ --endpoint-url "$ENDPOINT" | wc -l)
          TOTAL_COUNT=$((PUBLIC_COUNT + PRIVATE_COUNT))

          if [ "$TOTAL_COUNT" -eq 0 ]; then
            echo "Error: No audio files found in sonora-db-backups/audio/ after sync!"
            exit 1
          fi

          echo "Audio backup sync complete ($PUBLIC_COUNT public, $PRIVATE_COUNT private files present)."

      - name: Cleanup local temp files
        shell: bash
        run: |
          # Ensure any leftover temp files are removed
          rm -rf /tmp/*.sql.gz.gpg 2>/dev/null || true
          echo "Local cleanup complete."
