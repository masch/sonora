name: 3-ADMIN DB Backup

on:
  schedule:
    - cron: '0 2 * * 0' # Sunday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      # TODO: Create missing secrets before this workflow can run:
      #   BACKUP_ENCRYPTION_KEY  — passphrase for GPG AES256 encryption
      #   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account ID (for R2 wrangler ops)
      # DATABASE_URL is already set in the production environment.

      - name: Install PostgreSQL 18 client (pg_dump compatible with server 18.x)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18 2>/dev/null || {
            # Fallback: add official PostgreSQL apt repo
            sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client-18
          }

      - name: Database backup — pg_dump → gzip → GPG → R2
        shell: bash
        run: |
          DATE_TAG=$(date +%Y-%m-%d)
          BACKUP_FILE="sonora-db-${DATE_TAG}.sql.gz.gpg"
          TEMP_DIR=$(mktemp -d)
          TEMP_FILE="${TEMP_DIR}/${BACKUP_FILE}"

          echo "Dumping database..."
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          pg_dump --no-owner --no-acl "$DATABASE_URL" \
            | gzip \
            | gpg --symmetric --cipher-algo AES256 --batch --passphrase "$BACKUP_ENCRYPTION_KEY" \
            > "$TEMP_FILE"

          echo "Uploading to R2..."
          bunx wrangler r2 object put "sonora-db-backups/db/${BACKUP_FILE}" \
            --file "$TEMP_FILE"

          echo "Cleaning up backups older than 90 days from R2..."
          CUTOFF=$(date -d "90 days ago" +%Y-%m-%d)
          bunx wrangler r2 object list sonora-db-backups --prefix db/ --delimiter / \
            | jq -r '.objects[] | .key' \
            | while read -r key; do
                DATE_PART=$(echo "$key" | grep -oP '\d{4}-\d{2}-\d{2}')
                if [ -n "$DATE_PART" ] && [[ "$DATE_PART" < "$CUTOFF" ]]; then
                  echo "Deleting old backup: $key"
                  bunx wrangler r2 object delete "sonora-db-backups/${key}"
                fi
              done

          rm -rf "$TEMP_DIR"

      - name: Audio backup — wrangler copy to backup bucket
        shell: bash
        run: |
          DATE_TAG=$(date +%Y-%m-%d)
          TEMP_DIR=$(mktemp -d)

          echo "Listing objects in audio-bucket..."
          bunx wrangler r2 object list audio-bucket --delimiter / \
            | jq -r '.objects[] | .key' \
            | while read -r key; do
                LOCAL_PATH="${TEMP_DIR}/$(basename "$key")"

                echo "Downloading $key..."
                bunx wrangler r2 object get "audio-bucket/${key}" --file "$LOCAL_PATH"

                echo "Uploading to backup bucket (latest)..."
                bunx wrangler r2 object put "sonora-db-backups/audio/latest/${key}" \
                  --file "$LOCAL_PATH"

                echo "Archiving to date-stamped path..."
                bunx wrangler r2 object put "sonora-db-backups/audio/archive/${DATE_TAG}/${key}" \
                  --file "$LOCAL_PATH"
              done

          rm -rf "$TEMP_DIR"

      - name: Cleanup local temp files
        shell: bash
        run: |
          # Ensure any leftover temp files are removed
          rm -rf /tmp/*.sql.gz.gpg 2>/dev/null || true
          echo "Local cleanup complete."
