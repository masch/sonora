name: 2-STG API

permissions:
  contents: write

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_tagging:
        description: 'Skip tagging'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - '.github/workflows/**'
      - 'Makefile'
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-api-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Clean root tsconfig (prevents Wrangler warnings about missing expo/tsconfig.base)
        run: rm -f tsconfig.json
      - run: make api-validate
      - name: Apply pending DB migrations (idempotent)
        run: make api-db-migrate-ci
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Seed default + staging data (idempotent — upserts only)
        run: make api-db-seed-ci-staging
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEED_ENV: staging
      - name: Deploy to staging Worker
        run: make api-deploy-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Tag deployment
        uses: ./.github/actions/tag-release
        with:
          environment: staging
          skip_tagging: ${{ inputs.skip_tagging || 'false' }}
