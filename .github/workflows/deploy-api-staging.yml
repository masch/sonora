name: Deploy API Staging

on:
  pull_request:
    paths:
      - 'api/**'
    branches:
      - main

# Cancel previous runs for the same PR when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: make api-install
      - run: make api-validate
      - name: Apply pending DB migrations (idempotent)
        run: make api-db-migrate-ci
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
      - name: Deploy to staging Worker
        run: make api-deploy-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
