name: Expo SDK Version Sync

on:
  schedule:
    # Weekly: Monday 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: expo-sdk-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --minimum-release-age=0

      - name: Check Expo SDK version mismatches
        id: check
        working-directory: apps/mobile
        continue-on-error: true
        run: |
          # bash -e kills the script on non-zero exit; disable temporarily
          set +e
          npx expo install --check > /tmp/expo-check.log 2>&1
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/expo-check.log >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Apply Expo SDK version fixes
        if: steps.check.outputs.exit_code != '0'
        working-directory: apps/mobile
        env:
          BUN_CONFIG_INSTALL_MINIMUM_RELEASE_AGE: '0'
        run: |
          # expo install --fix internally spawns bun add which does NOT inherit
          # BUN_CONFIG_INSTALL_MINIMUM_RELEASE_AGE — it reads bunfig.toml instead.
          # Temporarily override minimumReleaseAge so the subprocess sees 0.
          cp ../../bunfig.toml /tmp/bunfig.toml.bak
          sed -i 's/minimumReleaseAge = 345600/minimumReleaseAge = 0/' ../../bunfig.toml
          npx expo install --fix
          mv /tmp/bunfig.toml.bak ../../bunfig.toml
          # Strip tilde/caret ranges from expo deps — pin exact versions only
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const tracked = Object.keys(pkg.dependencies || {}).filter(
            k => k.startsWith('expo') || k.startsWith('@expo/') || k === 'react-native-webview'
          );
          for (const k of tracked) {
            pkg.dependencies[k] = pkg.dependencies[k].replace(/^[\^~]/, '');
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Sync bun lockfile after expo install
        if: steps.check.outputs.exit_code != '0'
        run: bun install --minimum-release-age=0

      - name: Create Pull Request
        id: pr
        if: steps.check.outputs.exit_code != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT_PR_ONLY }}
          commit-message: 'chore: sync expo sdk dependency versions'
          branch: chore/expo-sdk-version-sync
          title: 'chore: sync expo sdk dependency versions'
          body: |
            Automated sync of Expo SDK dependency versions via `expo install --fix`.

            **Mismatches detected:**
            ```
            ${{ steps.check.outputs.output }}
            ```

            > [!IMPORTANT]
            > Manual review required before merging. All PR checks must pass.
          labels: dependencies

      - name: Trigger staging deploy with updates
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-mobile-staging.yml \
            --ref chore/expo-sdk-version-sync \
            -f build_android=true

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.check.outputs.exit_code }}" = "0" ]; then
            echo "✅ No mismatches detected. All good."
          elif [ "${{ steps.pr.outputs.pull-request-number }}" != "" ]; then
            echo "📦 PR #${{ steps.pr.outputs.pull-request-number }} created with fixes."
            echo "🚀 Staging deploy triggered from branch chore/expo-sdk-version-sync."
          else
            echo "⚠️ Mismatches detected but no changes were generated."
          fi
