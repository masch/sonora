name: Security Audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      severity-threshold:
        description: 'Minimum severity to fail the workflow'
        required: true
        default: 'moderate'
        type: choice
        options:
          - low
          - moderate
          - high
          - critical
      create-issue:
        description: 'Create a GitHub Issue on findings'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          skip-if-cache-hit: 'true'

      - name: Run bun audit
        id: audit
        continue-on-error: true
        run: |
          bun audit --json 2>/dev/null > audit-output.json || true
          echo "audit_exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Parse audit results and check severity threshold
        id: check
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const rawThreshold =
              '${{ github.event.inputs.severity-threshold || 'moderate' }}';
            const threshold = rawThreshold;
            const SEVERITY_ORDER = ['low', 'moderate', 'high', 'critical'];
            const minIndex = SEVERITY_ORDER.indexOf(threshold);

            // Explicitly allowlisted advisories:
            // - GHSA-w3rx-r6r6-pgpr (ICNS parser infinite loop DoS)
            // - GHSA-5p2g-fcmc-qvqq (JXL/HEIF parser infinite loop DoS)
            //
            // Rationale & Threat Model Assessment:
            // 1. Upstream Status: The 'image-size' repository was archived by its maintainers.
            //    No official patched version >=2.0.3 was ever released to the npm registry.
            // 2. Transitive Usage: 'image-size' is brought in exclusively as a build-time dependency
            //    by Expo CLI, Metro bundler, and React Native toolchains.
            // 3. Attack Vector Ineffective: The vulnerability requires feeding a maliciously crafted
            //    ICNS/HEIF buffer to trigger an event loop DoS. In Sonora, image-size is only invoked
            //    during local/CI asset bundling on trusted local source files, never on untrusted
            //    user uploads or runtime API endpoints. The effective blast radius in production is 0.
            // 4. Supply Chain Safety: Maintaining an allowlist here avoids depending on unverified
            //    third-party community forks in the core React Native build pipeline.
            const IGNORED_ADVISORIES = [
              'https://github.com/advisories/GHSA-w3rx-r6r6-pgpr',
              'https://github.com/advisories/GHSA-5p2g-fcmc-qvqq',
            ];

            let findings = [];

            try {
              const raw = fs.readFileSync('audit-output.json', 'utf8').trim();
              const data = JSON.parse(raw);

              for (const [pkg, advisories] of Object.entries(data)) {
                for (const adv of advisories) {
                  if (IGNORED_ADVISORIES.includes(adv.url)) {
                    console.log(
                      `Ignoring allowlisted advisory for ${pkg}: ${adv.url}`
                    );
                    continue;
                  }
                  const sevIdx = SEVERITY_ORDER.indexOf(adv.severity);
                  if (sevIdx >= minIndex && sevIdx !== -1) {
                    findings.push({
                      packageName: pkg,
                      severity: adv.severity,
                      advisory: adv.title,
                      url: adv.url,
                    });
                  }
                }
              }
            } catch (err) {
              console.log('Parse error:', err.message);
              const text = fs.readFileSync('audit-output.json', 'utf8');
              console.log('Raw output (first 500):', text.slice(0, 500));
            }

            if (findings.length === 0) {
              core.setOutput('should_fail', 'false');
            } else {
              core.setOutput('should_fail', 'true');
              core.setOutput('findings', JSON.stringify(findings));
            }

      - name: Output audit summary
        run: |
          echo "::group::🔒 Security Audit Results"
          echo ""
          echo "✅ No vulnerabilities above **moderate+** threshold."
          echo ""
          echo "_Report generated by security-audit workflow_"
          echo "::endgroup::"

      - name: Fail on threshold breach
        if: steps.check.outputs.should_fail == 'true'
        run: |
          echo "Vulnerabilities found above threshold. Failing workflow."
          exit 1

      - name: Create GitHub Issue on findings (manual dispatch only)
        if: |
          steps.check.outputs.should_fail == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.create-issue == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const findings = JSON.parse(
              '${{ steps.check.outputs.findings }}'
            );
            let body = '## Security Audit Findings\n\n';
            body += 'Vulnerabilities at or above **'
              + '${{ github.event.inputs.severity-threshold || 'moderate' }}'
              + '** threshold.\n\n';
            body += '| Package | Severity | Advisory |\n';
            body += '|---------|----------|----------|\n';
            for (const f of findings) {
              body += '| ' + f.packageName + ' | ' + f.severity + ' | ['
                + f.advisory + '](' + f.url + ') |\n';
            }
            body += '\n---\n';
            body += '_Generated by security-audit workflow on '
              + '${{ github.ref_name }}_';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Security Audit: '
                + findings.length + ' vulnerability(ies) found',
              body: body,
              labels: ['security']
            });
