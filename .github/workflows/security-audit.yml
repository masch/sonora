name: Security Audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      severity-threshold:
        description: 'Minimum severity to fail the workflow'
        required: true
        default: 'moderate'
        type: choice
        options:
          - low
          - moderate
          - high
          - critical
      create-issue:
        description: 'Create a GitHub Issue on findings'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  checks: write

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          skip-if-cache-hit: 'true'

      - name: Run bun audit
        id: audit
        continue-on-error: true
        run: |
          bun audit --json 2>/dev/null > audit-output.json || true
          echo "audit_exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Parse audit results and check severity threshold
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const rawThreshold =
              '${{ github.event.inputs.severity-threshold || 'moderate' }}';
            const threshold = rawThreshold;
            const SEVERITY_ORDER = ['low', 'moderate', 'high', 'critical'];
            const minIndex = SEVERITY_ORDER.indexOf(threshold);

            let findings = [];

            try {
              const raw = fs.readFileSync('audit-output.json', 'utf8').trim();
              const data = JSON.parse(raw);

              for (const [pkg, advisories] of Object.entries(data)) {
                for (const adv of advisories) {
                  const sevIdx = SEVERITY_ORDER.indexOf(adv.severity);
                  if (sevIdx >= minIndex && sevIdx !== -1) {
                    findings.push({
                      packageName: pkg,
                      severity: adv.severity,
                      advisory: adv.title,
                      url: adv.url,
                    });
                  }
                }
              }
            } catch (err) {
              console.log('Parse error:', err.message);
              const text = fs.readFileSync('audit-output.json', 'utf8');
              console.log('Raw output (first 500):', text.slice(0, 500));
            }

            if (findings.length === 0) {
              core.setOutput('should_fail', 'false');
            } else {
              core.setOutput('should_fail', 'true');
              core.setOutput('findings', JSON.stringify(findings));
            }

      - name: Attach summary to job check run
        uses: actions/github-script@v7
        with:
          script: |
            const rawThreshold =
              '${{ github.event.inputs.severity-threshold || 'moderate' }}';
            const findings = ${{ steps.check.outputs.findings || '[]' }};

            let summary = '## Security Audit Results\n\n';
            if (findings.length === 0) {
              summary += '✅ No vulnerabilities above **' + rawThreshold
                + '+** threshold.';
            } else {
              summary += 'Found **' + findings.length
                + '** vulnerability(ies) at or above **' + rawThreshold
                + '**';
              summary += '\n\n| Package | Severity | Advisory |\n';
              summary += '|---------|----------|----------|\n';
              for (const f of findings) {
                summary += '| ' + f.packageName + ' | ' + f.severity
                  + ' | ' + f.advisory + ' |\n';
              }
              summary += '\n_Report generated by security-audit workflow_';
            }

            const { data: runData } = await github.rest.actions
              .getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });

            const { data: checks } = await github.rest.checks
              .listForSuite({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_suite_id: runData.check_suite_id,
                check_name: 'audit',
              });

            const checkRun = checks.check_runs[0];
            if (checkRun) {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: checkRun.id,
                output: {
                  title: 'Security Audit — '
                    + rawThreshold + '+ threshold',
                  summary: summary,
                },
              });
            }

      - name: Fail on threshold breach
        if: steps.check.outputs.should_fail == 'true'
        run: |
          echo "Vulnerabilities found above threshold. Failing workflow."
          exit 1

      - name: Create GitHub Issue on findings (manual dispatch only)
        if: |
          steps.check.outputs.should_fail == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.create-issue == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const findings = JSON.parse(
              '${{ steps.check.outputs.findings }}'
            );
            let body = '## Security Audit Findings\n\n';
            body += 'Vulnerabilities at or above **'
              + '${{ github.event.inputs.severity-threshold || 'moderate' }}'
              + '** threshold.\n\n';
            body += '| Package | Severity | Advisory |\n';
            body += '|---------|----------|----------|\n';
            for (const f of findings) {
              body += '| ' + f.packageName + ' | ' + f.severity + ' | ['
                + f.advisory + '](' + f.url + ') |\n';
            }
            body += '\n---\n';
            body += '_Generated by security-audit workflow on '
              + '${{ github.ref_name }}_';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Security Audit: '
                + findings.length + ' vulnerability(ies) found',
              body: body,
              labels: ['security']
            });
