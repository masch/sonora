name: Deploy Mobile Staging

on:
  workflow_dispatch:
    inputs:
      deploy_web:
        description: 'Deploy web to EAS Hosting staging'
        required: false
        type: boolean
        default: true
      deploy_android:
        description: 'Build and deploy Android to Firebase App Distribution'
        required: false
        type: boolean
        default: false
      firebase_team:
        description: 'Firebase App Distribution tester group'
        required: false
        type: choice
        options:
          - internal
          - external
        default: internal

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPO_PUBLIC_API_URL: https://sonora-api-staging.sonora-api.workers.dev

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-web:
    name: Deploy Web Staging
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.deploy_web
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: ./.github/actions/setup
      - run: make check
      - name: Deploy Staging to EAS Hosting
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
        run: make eas-build-web-staging

  deploy-android:
    name: Deploy Android Staging (Manual)
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_android
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      apk_path: ${{ steps.build-apk.outputs.apk_path }}
    steps:
      - uses: ./.github/actions/setup
        with:
          fetch-depth: 0
      - run: make check
      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Write google-services.json
        env:
          ANDROID_GOOGLE_SERVICES_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_BASE64 }}
        run: |
          echo "$ANDROID_GOOGLE_SERVICES_BASE64" | base64 -d > apps/mobile/google-services.json
          git add -f apps/mobile/google-services.json

      - name: Calculate Version Code
        id: version-code
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "val=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
      - name: Build Android Preview APK
        id: build-apk
        env:
          APP_ENV: staging
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_INTERACTIVE: '1'
          APP_VERSION_CODE: ${{ steps.version-code.outputs.val }}
          EXPO_NO_DOCTOR: '1'
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
        run: |
          make eas-build-android-preview-ci
          # Export the exact APK path that was generated
          APK_PATH=$(ls -t apps/mobile/build-*.apk 2>/dev/null | head -1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/build-*.apk
          if-no-files-found: error
          retention-days: 7

  distribute-android:
    name: Distribute Android to Firebase Staging
    needs: deploy-android
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apps/mobile
      - name: Distribute Android APK to Firebase
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/apps/mobile/firebase-sa-key.json
          RAW_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          APK_PATH: ${{ needs.deploy-android.outputs.apk_path }}
        run: |
          # Write service account key
          mkdir -p apps/mobile
          echo "$FIREBASE_SA_KEY" > apps/mobile/firebase-sa-key.json

          CLEAN_MSG=$(echo "$RAW_COMMIT_MESSAGE" | head -n 1 | sed 's/"/\\"/g')
          export FIREBASE_RELEASE_NOTES="Staging Build ${{ github.run_number }} - $CLEAN_MSG"
          node apps/mobile/node_modules/firebase-tools/lib/bin/firebase.js \
            appdistribution:distribute "$APK_PATH" \
            --app "1:967212589494:android:602e693b852146f814e117" \
            --groups "${{ inputs.firebase_team == 'external' && 'external-testers' || 'dev-team' }}" \
            --release-notes "$FIREBASE_RELEASE_NOTES" \
            --non-interactive
