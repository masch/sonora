name: Deploy Mobile Staging

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Manual: Compile and deploy Android App (Firebase App Distribution)'
        required: true
        type: boolean
        default: true
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/**'
      - 'Makefile'
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPO_PUBLIC_API_URL: https://sonora-api-staging.sonora-api.workers.dev

concurrency:
  group: deploy-staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy-web:
    name: Deploy Web Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - run: make check
      - name: Deploy Staging to EAS Hosting
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
        run: make eas-build-web-staging

  deploy-android:
    name: Deploy Android Staging (Manual)
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.build_android == true
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      apk_path: ${{ steps.build-apk.outputs.apk_path }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - run: make check
      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Fetch Firebase Configuration
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
        run: |
          # Fetch Android App ID from Firebase project
          APP_ID=$(npx -y firebase-tools@latest apps:list --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive | grep -i "android" | awk -F'│' '{print $3}' | xargs)

          if [ -z "$APP_ID" ]; then
            # Fallback to hardcoded App ID if listing fails
            APP_ID="1:967054219260:android:aad883fdf7059bec060479"
          fi

          # Fetch google-services.json config
          npx -y firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive > apps/mobile/google-services.json

      - name: Build Android Preview APK
        id: build-apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_INTERACTIVE: '1'
          APP_VERSION_CODE: ${{ github.run_number }}
          EXPO_NO_DOCTOR: '1'
        run: |
          make eas-build-android-preview-ci
          # Export the exact APK path that was generated
          APK_PATH=$(ls -t apps/mobile/build-*.apk 2>/dev/null | head -1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/build-*.apk
          if-no-files-found: error
          retention-days: 7

  distribute-android:
    name: Distribute Android to Firebase Staging
    needs: deploy-android
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apps/mobile
      - name: Distribute Android APK to Firebase
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/apps/mobile/firebase-sa-key.json
          RAW_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          APK_PATH: ${{ needs.deploy-android.outputs.apk_path }}
        run: |
          # Write service account key
          mkdir -p apps/mobile
          echo "$FIREBASE_SA_KEY" > apps/mobile/firebase-sa-key.json

          CLEAN_MSG=$(echo "$RAW_COMMIT_MESSAGE" | head -n 1 | sed 's/"/\\"/g')
          export FIREBASE_RELEASE_NOTES="Staging Build ${{ github.run_number }} - $CLEAN_MSG"
          node apps/mobile/node_modules/firebase-tools/lib/bin/firebase.js \
            appdistribution:distribute "$APK_PATH" \
            --app "1:967054219260:android:aad883fdf7059bec060479" \
            --groups "dev-team" \
            --release-notes "$FIREBASE_RELEASE_NOTES" \
            --non-interactive
