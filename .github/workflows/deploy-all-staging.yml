name: 2-STG Deploy All

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build and deploy Android APK to Firebase App Distribution'
        required: true
        type: boolean
        default: true
      firebase_groups:
        description: 'Firebase App Distribution Groups (comma-separated)'
        required: true
        type: string
        default: 'dev-team'

permissions:
  contents: write

jobs:
  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag release
        uses: ./.github/actions/tag-release
        with:
          environment: staging

  deploy-web:
    name: Deploy Web Staging
    needs: tag-release
    uses: ./.github/workflows/deploy-mobile-web-staging.yml
    with:
      skip_tagging: true
    secrets: inherit

  deploy-admin:
    name: Deploy Admin Staging
    needs: [deploy-web, tag-release]
    uses: ./.github/workflows/deploy-admin-staging.yml
    with:
      skip_tagging: true
    secrets: inherit

  deploy-api:
    name: Deploy API Staging
    needs: [deploy-admin, tag-release]
    uses: ./.github/workflows/deploy-api-staging.yml
    with:
      skip_tagging: true
    secrets: inherit

  deploy-android:
    name: Deploy Android Staging
    needs: [deploy-api, tag-release]
    if: |
      always() &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.build_android == 'true') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/deploy-mobile-android-staging.yml
    with:
      firebase_groups: ${{ inputs.firebase_groups || github.event.inputs.firebase_groups || 'dev-team' }}
      skip_tagging: true
    secrets: inherit
