# Composite action: Bun setup + cache + install
# Does NOT include checkout — each workflow must checkout first
# so GitHub Actions can find this local action file.
name: Bun Setup
description: Setup Bun, restore cache, and install dependencies

inputs:
  minimum-release-age:
    description: Override bun minimum release age in seconds (0 to disable the guard)
    required: false
    default: ''
  skip-if-cache-hit:
    description: Skip bun install when cache fully restores node_modules
    required: false
    default: 'false'
  bun-version:
    description: Pin a specific Bun version (default 1.3.14)
    required: false
    default: '1.3.14'

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - uses: actions/cache/restore@v5
      id: bun-cache
      continue-on-error: true
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        # `bunfig.toml` is part of the key because the linker decides the layout:
        # an isolated tree restored next to a hoisted lock is not the tree this
        # lock describes.
        key: bun-${{ hashFiles('bun.lock', 'bunfig.toml') }}
        # No `restore-keys` prefix fallback on purpose. It restored a node_modules
        # from a previous lock, `bun install --frozen-lockfile` leaves an existing
        # tree that it considers satisfied alone, and a staging deploy then ran the
        # SDK 56 CLI (`@expo/cli@56.1.23`) against an SDK 57 app and died with
        # `c.resetServerContext is not a function`. An exact-key miss is a cold
        # install, which bun does in seconds — always cheaper than a wrong tree.

    - name: Install dependencies
      if: inputs.skip-if-cache-hit != 'true' || steps.bun-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        REL_AGE="${{ inputs.minimum-release-age != '' && format('--minimum-release-age={0}', inputs.minimum-release-age) || '' }}"
        bun install --frozen-lockfile $REL_AGE

    - name: Save cache
      if: steps.bun-cache.outcome == 'success' && steps.bun-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: bun-${{ hashFiles('bun.lock', 'bunfig.toml') }}
