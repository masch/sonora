name: 'Tag Release'
description: 'Determine git tag, extract validated semver, and optionally create a new revision tag'
inputs:
  environment:
    description: 'Target environment (staging or production)'
    required: true
  skip_tagging:
    description: 'Skip creating a new tag'
    required: false
    default: 'false'

outputs:
  version-name:
    description: 'Extracted and validated semver (e.g. 1.0.3)'
    value: ${{ steps.extract.outputs.version-name }}
  tag:
    description: 'Full tag name (e.g. stg-v1.0.3)'
    value: ${{ steps.get-tag.outputs.tag }}

runs:
  using: 'composite'
  steps:
    - name: Create and Push Tag
      if: ${{ inputs.skip_tagging != 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        VERSION=$(node -p "require('./package.json').version")

        MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1-2)

        if [ "${{ inputs.environment }}" = "production" ]; then
          PREFIX="prod-v"
        else
          PREFIX="stg-v"
        fi

        git fetch --tags --force
        LAST_PATCH=$(git tag -l "$PREFIX$MAJOR_MINOR.*" | sed "s/$PREFIX$MAJOR_MINOR.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)

        if [ -z "$LAST_PATCH" ]; then
          PATCH=0
        else
          PATCH=$((LAST_PATCH + 1))
        fi

        TAG_NAME="$PREFIX$MAJOR_MINOR.$PATCH"

        LAST_TAG=$(git describe --tags --abbrev=0 --match "$PREFIX*" HEAD^ 2>/dev/null || echo "")

        if [ -z "$LAST_TAG" ]; then
          NOTES=$(git log -5 --pretty=format:'- %s' 2>/dev/null | tr -d '\"'\''')
        else
          NOTES=$(git log $LAST_TAG..HEAD --pretty=format:'- %s' 2>/dev/null | tr -d '\"'\''')
        fi

        TAG_COUNT=$(git tag -l "$PREFIX*" | wc -l)
        VERSION_CODE=$((TAG_COUNT + 1))

        echo "Creating annotated tag $TAG_NAME"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        ANNOTATION_MSG=$(printf "Created by GitHub Actions\nWorkflow: %s\nRun Number: %s\nRun ID: %s\nRun URL: %s/%s/actions/runs/%s\nVersion Code (APK): %s\n\nRelease Notes:\n%s" \
          "$GITHUB_WORKFLOW" \
          "$GITHUB_RUN_NUMBER" \
          "$GITHUB_RUN_ID" \
          "$GITHUB_SERVER_URL" \
          "$GITHUB_REPOSITORY" \
          "$GITHUB_RUN_ID" \
          "$VERSION_CODE" \
          "$NOTES")

        git tag -a "$TAG_NAME" -m "$ANNOTATION_MSG"
        git push origin "$TAG_NAME"

        if [ "${{ inputs.environment }}" = "production" ]; then
          gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "$ANNOTATION_MSG"
        else
          gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "$ANNOTATION_MSG" --prerelease
        fi

    - name: Determine Tag Name
      id: get-tag
      shell: bash
      run: |
        git fetch --tags --force
        TAG_NAME=$(git describe --tags --exact-match 2>/dev/null || git describe --tags --abbrev=0 || echo "")
        echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

    - name: Extract & Validate Version Name
      id: extract
      shell: bash
      run: |
        TAG="${{ steps.get-tag.outputs.tag }}"

        if [ -z "$TAG" ]; then
          echo "::error::No git tag found. Cannot extract version name."
          exit 1
        fi

        VERSION_NAME="${TAG#prod-v}"
        VERSION_NAME="${VERSION_NAME#stg-v}"

        if [ -z "$VERSION_NAME" ]; then
          echo "::error::Empty version extracted from tag '$TAG'"
          exit 1
        fi

        if ! echo "$VERSION_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::Invalid semver '$VERSION_NAME' extracted from tag '$TAG'. Expected format X.Y.Z"
          exit 1
        fi

        echo "version-name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
