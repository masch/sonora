name: 'Tag Release'
description: 'Calculate and push dynamic SemVer tags with revision increments'
inputs:
  environment:
    description: 'Target environment (staging or production)'
    required: true
  skip_tagging:
    description: 'Skip tagging'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Create and Push Tag
      if: ${{ inputs.skip_tagging != 'true' }}
      shell: bash
      run: |
        VERSION=$(node -p "require('./package.json').version")

        MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1-2)

        if [ "${{ inputs.environment }}" = "production" ]; then
          PREFIX="prod-v"
        else
          PREFIX="stg-v"
        fi

        git fetch --tags --force
        LAST_PATCH=$(git tag -l "$PREFIX$MAJOR_MINOR.*" | sed "s/$PREFIX$MAJOR_MINOR.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)

        if [ -z "$LAST_PATCH" ]; then
          PATCH=0
        else
          PATCH=$((LAST_PATCH + 1))
        fi

        TAG_NAME="$PREFIX$MAJOR_MINOR.$PATCH"

        TAG_COUNT=$(git tag -l "$PREFIX*" | wc -l)
        VERSION_CODE=$((TAG_COUNT + 1))

        echo "Creating annotated tag $TAG_NAME"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        ANNOTATION_MSG="Created by GitHub Actions
        Workflow: $GITHUB_WORKFLOW
        Run Number: $GITHUB_RUN_NUMBER
        Run ID: $GITHUB_RUN_ID
        Run URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
        Version Code (APK): $VERSION_CODE"

        git tag -a "$TAG_NAME" -m "$ANNOTATION_MSG"
        git push origin "$TAG_NAME"
