name = "sonora-api-staging"
main = "src/index.ts"
compatibility_date = "2026-06-03"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

# KV binding for feedback idempotency (fast-path only — Postgres is authoritative)
# Create the namespace with: npx wrangler kv:namespace create "FEEDBACK_STORE"
# Then copy the id below:
# kv_namespaces = [
#   { binding = "FEEDBACK_STORE", id = "<your-namespace-id>" }
# ]

[vars]
DB_ADAPTER = "neon"
ENVIRONMENT = "staging"
ADMIN_SESSION_COOKIE_SAMESITE = "None"
AUDIO_LINK_EXPIRY_SECONDS = "900"

# Published map artifacts served by this same Worker from the public bucket. The
# client rewrites the style's source url with its local protocol, so one style
# works in every environment, and both urls are derived from this version plus the
# request origin.
# Published once per version: bump this before publishing anything new. The upload
# targets (and `make map-tiles-publish-staging`) refuse a version whose objects are
# already in the bucket, so a republish is a new value here plus a deploy.
MAP_ARTIFACT_VERSION = "v8"
# Regions the app prefetches when it opens. A region the public bucket does not
# hold is dropped from the payload instead of being handed to a client.
MAP_PRELOAD_REGIONS = "calamuchita"
# Renderer served to this environment's clients. `maplibre` switches every build
# that left the choice open; anything else keeps them on the Leaflet map.
# Staging serves the new map to the whole capable fleet on purpose: a stale staging
# build is reinstalled, not supported (same reasoning as `MAP_LAYERS_WIRE` below).
# The rollback is this value back to `leaflet` plus a deploy — no app release — and
# it reaches every build that left the choice open. A build made with
# `EXPO_PUBLIC_MAP_RENDERER=maplibre` stays on MapLibre regardless (T7 device builds).
MAP_RENDERER = "maplibre"
# Capability gate, not a preference: only these platforms can render the new map, and
# `resolveMapRenderer` reads it before any list, so an incapable or missing platform
# keeps Leaflet even with the value above. `web` is deliberately absent: the export
# emits MapLibre's worker as a static asset (`scripts/copy-maplibre-worker.mjs`), but
# the bundle published to staging is a manual `deploy-mobile-web-staging` run, so
# nothing guarantees the served export carries it and a browser without it dies in
# the map's error state. Add `web` back only after a HEAD on the deployed
# `/maplibre-gl-worker.js` answers 200 with a JavaScript content type. No allowlist or
# denylist is set: every capable device is served, and an individual device is pulled
# back through `MAP_RENDERER_DEVICE_IDS_BLOCKED` (a Cloudflare secret) rather than
# turning the environment off.
MAP_RENDERER_PLATFORMS = "android,ios"

# --- Layer selector (`map.layers`) -----------------------------------------
# This environment publishes the field because staging is for testing: a stale
# staging build is reinstalled, not supported, so the strict schema in builds
# older than the tolerant one costs nothing here. Production deliberately keeps
# all three unset (see `wrangler.toml`).
#
# Whether `map.layers` travels at all. `true` is the only value that publishes it.
MAP_LAYERS_WIRE = "true"
# Whether the walker is offered the selector. Independent of the wire switch.
MAP_LAYERS_SHOW_CONTROL = "true"
# Groups the sheet lists, in the order written here; a leading dash opens the
# group hidden (`-buildings`). Ids this build does not implement are dropped.
MAP_LAYERS_GROUPS = "roads,water,places,pois,boundaries,green,buildings"

[define]
MP_BYPASS_SIGNATURE = "true"
MP_SIGNATURE_MAX_AGE_MINUTES = "5"

[[kv_namespaces]]
binding = "RATE_LIMIT_STORE"
id = "5b90bc7890fc4de3b6fadefef16f9e14"

[[r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "sonora-staging-private-audio"

[[r2_buckets]]
binding = "PUBLIC_BUCKET"
bucket_name = "sonora-staging-public-audio"
