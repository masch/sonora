name = "sonora-api-staging"
main = "src/index.ts"
compatibility_date = "2026-06-03"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

# KV binding for feedback idempotency (fast-path only — Postgres is authoritative)
# Create the namespace with: npx wrangler kv:namespace create "FEEDBACK_STORE"
# Then copy the id below:
# kv_namespaces = [
#   { binding = "FEEDBACK_STORE", id = "<your-namespace-id>" }
# ]

[vars]
DB_ADAPTER = "neon"
ENVIRONMENT = "staging"
ADMIN_SESSION_COOKIE_SAMESITE = "None"
AUDIO_LINK_EXPIRY_SECONDS = "900"

# Map artifacts served by this same Worker from the public bucket. The client
# rewrites the style's source url with its local protocol, so one style works in
# every environment.
MAP_ARCHIVE_URL = "https://sonora-api-staging.sonora-api.workers.dev/media/public/tiles/calamuchita/v1.pmtiles"
MAP_STYLE_URL = "https://sonora-api-staging.sonora-api.workers.dev/media/public/styles/v1.json"
# Renderer served to this environment's clients. `maplibre` switches every build
# that left the choice open; anything else keeps them on the Leaflet map.
MAP_RENDERER = "leaflet"
# Capability gate, not a preference: only these platforms can render the new map.
# `web` is included in staging only: the web bundle published from df1f0ae carries
# the MapLibre worker, so a browser is now able to render it. The global value stays
# `leaflet`, so this only decides who *can* be switched on — the device allowlist
# decides who *is*.
MAP_RENDERER_PLATFORMS = "android,ios,web"

[define]
MP_BYPASS_SIGNATURE = "true"
MP_SIGNATURE_MAX_AGE_MINUTES = "5"

[[kv_namespaces]]
binding = "RATE_LIMIT_STORE"
id = "5b90bc7890fc4de3b6fadefef16f9e14"

[[r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "sonora-staging-private-audio"

[[r2_buckets]]
binding = "PUBLIC_BUCKET"
bucket_name = "sonora-staging-public-audio"
