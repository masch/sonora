name = "sonora-api"
main = "src/index.ts"
compatibility_date = "2026-06-03"
compatibility_flags = ["nodejs_compat"]

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

# KV binding for feedback idempotency (fast-path only — Postgres is authoritative)
# Create the namespace with: npx wrangler kv:namespace create "FEEDBACK_STORE"
# Then copy the id below:
# kv_namespaces = [
#   { binding = "FEEDBACK_STORE", id = "<your-namespace-id>" }
# ]

[vars]
DB_ADAPTER = "neon"
ENVIRONMENT = "production"
ADMIN_SESSION_COOKIE_SAMESITE = "None"
AUDIO_LINK_EXPIRY_SECONDS = "900"

MINIMUM_APP_VERSION = "0.0.0"
BLOCK_OLDER_VERSIONS = "false"
# ISO dates for grace period range (e.g. "2026-07-02T00:00:00Z" to "2026-07-09T00:00:00Z")
# GRACE_PERIOD_START = "2026-07-02T00:00:00Z"
# GRACE_PERIOD_END = "2026-07-09T00:00:00Z"

[define]
MP_BYPASS_SIGNATURE = "false"
MP_SIGNATURE_MAX_AGE_MINUTES = "5"

[[kv_namespaces]]
binding = "RATE_LIMIT_STORE"
id = "714dc0b57720433e9481fbd9b7d68870"

[[r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "sonora-production-private-audio"

[[r2_buckets]]
binding = "PUBLIC_BUCKET"
bucket_name = "sonora-production-public-audio"
