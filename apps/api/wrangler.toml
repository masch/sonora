name = "sonora-api"
main = "src/index.ts"
compatibility_date = "2026-06-03"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

# KV binding for feedback idempotency (fast-path only — Postgres is authoritative)
# Create the namespace with: npx wrangler kv:namespace create "FEEDBACK_STORE"
# Then copy the id below:
# kv_namespaces = [
#   { binding = "FEEDBACK_STORE", id = "<your-namespace-id>" }
# ]

[vars]
DB_ADAPTER = "neon"
ENVIRONMENT = "production"
ADMIN_SESSION_COOKIE_SAMESITE = "None"
AUDIO_LINK_EXPIRY_SECONDS = "900"

# Published map artifacts served by this same Worker from the public bucket.
# Production needs the API deployed with the /media route before these resolve.
# The archive and style urls are derived from this version and the request origin.
MAP_ARTIFACT_VERSION = "v1"
# Regions the app prefetches when it opens. A region the public bucket does not
# hold is dropped from the payload instead of being handed to a client.
MAP_PRELOAD_REGIONS = "calamuchita"
# Renderer served to this environment's clients. `maplibre` switches every build
# that left the choice open; anything else keeps them on the Leaflet map.
MAP_RENDERER = "leaflet"
# Capability gate, not a preference: only these platforms can render the new map.
# `web` is absent because the web export emits no MapLibre worker yet — adding
# `web` here is what turns the new map on in browsers, once that worker loads.
MAP_RENDERER_PLATFORMS = "android,ios"

# --- Layer selector (`map.layers`) -----------------------------------------
# `MAP_LAYERS_WIRE`, `MAP_LAYERS_SHOW_CONTROL` and `MAP_LAYERS_GROUPS` are
# deliberately absent here, and absent means off. The field is only parseable by
# builds released with the tolerant `MapConfigSchema`; an older build rejects the
# whole `map` object over that one unknown key and loses its renderer, its region
# catalog and its download policy. Lifting this gate is a production release
# decision, and that release is the one that raises `MINIMUM_APP_VERSION` (with
# `BLOCK_OLDER_VERSIONS` and, if needed, the grace window) so no installed build
# keeps calling `/config` without the tolerant schema. Gating the field on the
# version a client sends is a rejected alternative, not a deferred one: the app
# already enforces a floor. Staging publishes it today (see `wrangler.staging.toml`).

MINIMUM_APP_VERSION = "1.0.123"
BLOCK_OLDER_VERSIONS = "true"
# ISO dates for grace period range (e.g. "2026-07-02T00:00:00Z" to "2026-07-09T00:00:00Z")
# GRACE_PERIOD_START = "2026-07-02T00:00:00Z"
# GRACE_PERIOD_END = "2026-07-09T00:00:00Z"

[define]
MP_BYPASS_SIGNATURE = "false"
MP_SIGNATURE_MAX_AGE_MINUTES = "5"

[[kv_namespaces]]
binding = "RATE_LIMIT_STORE"
id = "714dc0b57720433e9481fbd9b7d68870"

[[r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "sonora-production-private-audio"

[[r2_buckets]]
binding = "PUBLIC_BUCKET"
bucket_name = "sonora-production-public-audio"
